name: Build and Push Frontend Image

on:
    push:
        branches:
            - refactor/full-project
        paths-ignore:
            - "argocd/**"
            - "k8s/**"
            - "**/*.md"
    workflow_dispatch:

concurrency:
    group: iwtc-frontend-production
    cancel-in-progress: true

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: dongmin3891/iwtc-frontend-new

jobs:
    verify-build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify
              run: |
                  npm run typecheck
                  npm test
                  npm run lint
                  npm run build

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            - name: Update Kubernetes image tag
              env:
                  IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
              run: |
                  sed -i "s|image: ghcr.io/dongmin3891/iwtc-frontend-new:.*|image: ${IMAGE}|" k8s/deployment.yaml

            - name: Commit Kubernetes manifest
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add k8s/deployment.yaml

                  if git diff --cached --quiet; then
                      echo "No manifest changes"
                      exit 0
                  fi

                  git commit -m "ops: deploy ${GITHUB_SHA}"
                  git push
