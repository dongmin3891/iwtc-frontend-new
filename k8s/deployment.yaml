apiVersion: apps/v1
kind: Deployment
metadata:
    name: iwtc-frontend
    namespace: iwtc
spec:
    replicas: 2
    revisionHistoryLimit: 3
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app: iwtc-frontend
    template:
        metadata:
            labels:
                app: iwtc-frontend
        spec:
            terminationGracePeriodSeconds: 30
            containers:
                - name: frontend
                  image: ghcr.io/dongmin3891/iwtc-frontend-new:16d6a1a966575826863b6dfe7444b184c47fa669
                  imagePullPolicy: Always
                  securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                      seccompProfile:
                          type: RuntimeDefault
                  ports:
                      - name: http
                        containerPort: 3000
                  lifecycle:
                      preStop:
                          exec:
                              command:
                                  - sh
                                  - -c
                                  - sleep 5
                  startupProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 5
                      timeoutSeconds: 2
                      failureThreshold: 12
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 2
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      initialDelaySeconds: 15
                      periodSeconds: 20
                      timeoutSeconds: 2
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          cpu: 500m
                          memory: 512Mi
